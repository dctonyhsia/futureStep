    <section class="section news-section">
      <div class="wrap">

  <footer class="footer">
    <div class="wrap footer-grid">
      <div>
        <p class="footer-brand">期貨・選擇權入門指南</p>

  </footer>

  <script src="news.js"></script>
  <script>
    (function () {
      var d = window.NEWS_DATA, box = document.querySelector(".news-list");
      if (!d || !box) return;
      var esc = function (s) { return String(s || "").replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
      // 帶單位的數字自動加粗（例如 15%、1,926 點、2,165 元）
      var num = function (s) {
        return s.replace(/[−+-]?\d[\d,.]*\s?(?:%|萬顆|萬|億|點|元|角|顆|倍|次)/g,
          '<b style="color:var(--accent)">$&</b>');
      };
      document.querySelector(".news-updated").textContent =
        "更新時間：" + d.updated + (d.note ? "（" + d.note + "）" : "");
      // 時間只留「月/日 時:分」，同一天的新聞看起來比較清爽
      var short = function (t) { var m = String(t || "").match(/\d{4}-(\d{2})-(\d{2})\s+(\d{1,2}:\d{2})/); return m ? (+m[1]) + "/" + (+m[2]) + " " + m[3] : String(t || ""); };
      var items = d.items.slice().sort(function (a, b) { return String(b.time).localeCompare(String(a.time)); });   // 新到舊
      box.innerHTML = items.map(function (n, i) {
        var first = n.points && n.points[0] ? n.points[0] : (n.summary || "");
        return '<details class="news-item" data-tag="' + esc(n.tag) + '">' +
          '<summary>' +
            '<span class="news-tag">' + esc(n.tag) + '</span>' +
            '<time class="news-time" datetime="' + esc(n.time) + '">' + esc(short(n.time)) + '</time>' +
            '<span class="news-head"><b class="news-title">' + esc(n.title) + '</b><span class="news-peek">' + esc(first) + '</span></span>' +
            '<span class="news-chev" aria-hidden="true">▾</span>' +
          '</summary>' +
          '<div class="news-body">' +
            (n.points ? '<ul>' + n.points.map(function (p) { return '<li>' + num(esc(p)) + '</li>'; }).join("") + '</ul>'
              : '<p>' + num(esc(n.summary)) + '</p>') +
            (n.watch ? '<p class="news-watch"><b>觀察重點：</b>' + num(esc(n.watch)) + '</p>' : '') +
            '<p class="news-src">來源：' + esc(n.source) +
            '｜<a href="' + esc(n.url) + '" target="_blank" rel="noopener">看原文</a></p>' +
          '</div>' +
          '</details>';
      }).join("");
      // 分類篩選
      var bar = document.querySelector(".news-filter"), allBtn = document.querySelector(".news-all");
      var tags = [];
      items.forEach(function (n) { if (tags.indexOf(n.tag) < 0) tags.push(n.tag); });
      var count = function (t) { return items.filter(function (n) { return !t || n.tag === t; }).length; };
      bar.innerHTML = [""].concat(tags).map(function (t) {
        return '<button type="button" class="news-chip' + (t ? '' : ' active') + '" data-tag="' + esc(t) + '" aria-pressed="' + (!t) + '">' + esc(t || "全部") + ' <small>' + count(t) + '</small></button>';
      }).join("");
      bar.addEventListener("click", function (e) {
        var b = e.target.closest("button"); if (!b) return;
        var t = b.getAttribute("data-tag");
        bar.querySelectorAll("button").forEach(function (x) { var on = x === b; x.classList.toggle("active", on); x.setAttribute("aria-pressed", on); });
        box.querySelectorAll(".news-item").forEach(function (it) { it.hidden = !!t && it.getAttribute("data-tag") !== t; });
      });
      // 全部展開／收起
      var syncAll = function () {
        var open = [].every.call(box.querySelectorAll(".news-item:not([hidden])"), function (it) { return it.open; });
        allBtn.textContent = open ? "全部收起" : "全部展開"; allBtn.setAttribute("aria-pressed", open);
      };
      allBtn.addEventListener("click", function () {
        var open = allBtn.getAttribute("aria-pressed") !== "true";
        box.querySelectorAll(".news-item:not([hidden])").forEach(function (it) { it.open = open; });
        syncAll();
      });
      box.addEventListener("toggle", syncAll, true);
      // 頁尾「資料來源」：自動列出今天新聞用到的媒體（新聞來源可寫成「經濟日報、鉅亨網」或「經濟日報（DIGITIMES 研究）」）
      var SITES = { "經濟日報": "https://money.udn.com/", "Yahoo股市": "https://tw.stock.yahoo.com/", "鉅亨網": "https://news.cnyes.com/", "DIGITIMES": "https://www.digitimes.com.tw/" };
      var srcList = document.querySelector(".footer .sources"), names = [];
      items.forEach(function (n) {
        String(n.source || "").replace(/[（）()]/g, "、").split("、").forEach(function (s) {
          s = s.trim().replace(/\s*研究$/, "");
          if (s && names.indexOf(s) < 0) names.push(s);
        });
      });
      if (srcList && names.length) srcList.insertAdjacentHTML("beforeend", names.map(function (s) {
        return '<li>' + (SITES[s] ? '<a href="' + SITES[s] + '" target="_blank" rel="noopener">' + esc(s) + '（新聞）</a>' : esc(s) + '（新聞）') + '</li>';
      }).join(""));
    })();
  </script>
  <script src="data.js" defer></script>
  <script src="script.js" defer></script>
