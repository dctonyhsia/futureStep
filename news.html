  <script src="news.js"></script>
  <script>
    (function () {
      var d = window.NEWS_DATA, box = document.querySelector(".news-list");
      if (!d || !box) return;
      var esc = function (s) { return String(s || "").replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
      document.querySelector(".news-updated").textContent =
        "更新時間：" + d.updated + (d.note ? "（" + d.note + "）" : "");
      box.innerHTML = d.items.map(function (n) {
        return '<article class="card">' +
          '<span class="card-idx">' + esc(n.tag) + ' · ' + esc(n.time) + '</span>' +
          '<h3 style="margin:4px 0 10px;line-height:1.5">' + esc(n.title) + '</h3>' +
          '<p style="line-height:1.8">' + esc(n.summary) + '</p>' +
          (n.watch ? '<p style="margin-top:12px;padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);color:var(--text);border-radius:6px"><b>觀察重點：</b>' + esc(n.watch) + '</p>' : '') +
          '<p class="small" style="margin-top:12px">來源：' + esc(n.source) +
          '｜<a href="' + esc(n.url) + '" target="_blank" rel="noopener" style="color:var(--accent)">看原文</a></p>' +
          '</article>';
      }).join("");
    })();
  </script>
  <script src="data.js" defer></script>
